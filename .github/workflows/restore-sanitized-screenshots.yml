name: Restore sanitized screenshots
on:
  push:
    paths:
      - .github/workflows/restore-sanitized-screenshots.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Redact public IP addresses in original screenshots
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p docs/screenshots
          git show v1.0.1:docs/screenshots/01-main-ru.png > /tmp/gui-ru-original.png
          git show v1.0.1:docs/screenshots/02-main-en.png > /tmp/gui-en-original.png
          convert /tmp/gui-ru-original.png -fill '#20242b' -draw 'rectangle 110,76 240,108' docs/screenshots/01-main-ru.png
          convert /tmp/gui-en-original.png -fill '#20242b' -draw 'rectangle 96,70 241,106' docs/screenshots/02-main-en.png
          for file in docs/screenshots/01-main-ru.png docs/screenshots/02-main-en.png; do
            for x in $(seq 95 9 240); do
              convert "$file" -stroke '#eeeeee' -strokewidth 2 -draw "line $x,104 $((x+25)),78" "$file"
            done
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/01-main-ru.png docs/screenshots/02-main-en.png
          git commit -m 'docs: restore redacted screenshots'
          git push
